<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-label="Animated dark neon gradient background">
  <defs>
    <radialGradient id="blue" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6EA8FF" stop-opacity=".82"/>
      <stop offset="48%" stop-color="#6EA8FF" stop-opacity=".22"/>
      <stop offset="100%" stop-color="#03040A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="violet" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#A78BFA" stop-opacity=".78"/>
      <stop offset="52%" stop-color="#A78BFA" stop-opacity=".18"/>
      <stop offset="100%" stop-color="#03040A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cyan" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#67E8F9" stop-opacity=".34"/>
      <stop offset="58%" stop-color="#67E8F9" stop-opacity=".08"/>
      <stop offset="100%" stop-color="#03040A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="veil" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#03040A"/>
      <stop offset="52%" stop-color="#080A14"/>
      <stop offset="100%" stop-color="#02030A"/>
    </linearGradient>
    <filter id="blur">
      <feGaussianBlur stdDeviation="44"/>
    </filter>
    <pattern id="grid" width="72" height="72" patternUnits="userSpaceOnUse">
      <path d="M72 0H0v72" fill="none" stroke="#fff" stroke-opacity=".045" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1920" height="1080" fill="url(#veil)"/>
  <rect width="1920" height="1080" fill="url(#grid)" opacity=".72"/>
  <g filter="url(#blur)" style="mix-blend-mode:screen">
    <circle r="330" fill="url(#blue)" cx="390" cy="262">
      <animate attributeName="cx" values="320;520;390;320" dur="18s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="280;180;390;280" dur="22s" repeatCount="indefinite"/>
    </circle>
    <circle r="420" fill="url(#violet)" cx="1450" cy="286">
      <animate attributeName="cx" values="1380;1580;1280;1380" dur="24s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="250;380;210;250" dur="20s" repeatCount="indefinite"/>
    </circle>
    <circle r="410" fill="url(#cyan)" cx="1050" cy="850">
      <animate attributeName="cx" values="920;1180;1040;920" dur="26s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="860;760;940;860" dur="21s" repeatCount="indefinite"/>
    </circle>
  </g>
  <path d="M0 760c284-74 440-62 690 10 360 104 600 84 1230-82v392H0z" fill="#03040A" opacity=".42"/>
</svg>
